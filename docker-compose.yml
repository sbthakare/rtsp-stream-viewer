# Backend + a local RTSP server (MediaMTX) + three synthetic "cameras" published with FFmpeg.
# Start the frontend separately with `npm run dev` (see README).
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP

  cam1:
    image: jrottenberg/ffmpeg:6-alpine
    restart: unless-stopped
    depends_on: [mediamtx]
    command: >
      -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam1

  cam2:
    image: jrottenberg/ffmpeg:6-alpine
    restart: unless-stopped
    depends_on: [mediamtx]
    command: >
      -hide_banner -loglevel error -re -f lavfi -i mandelbrot=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam2

  cam3:
    image: jrottenberg/ffmpeg:6-alpine
    restart: unless-stopped
    depends_on: [mediamtx]
    command: >
      -hide_banner -loglevel error -re -f lavfi -i smptehdbars=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam3

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on: [mediamtx]
    environment:
      ALLOWED_ORIGINS: "*"
      MAX_STREAMS: "8"
      VIDEO_BITRATE: "4000k"
      FPS: "25"
